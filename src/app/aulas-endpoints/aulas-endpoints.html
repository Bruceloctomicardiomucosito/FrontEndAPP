<p>aulas-endpoints works!</p>
<mat-table #tableAulas [dataSource]="dataSource" class="table table-striped">

    <!-- Position Column -->
    <ng-container matColumnDef="idAula">
        <mat-header-cell *matHeaderCellDef> # </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idAula}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="idEdificio">
        <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idEdificio}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="observaciones">
        <mat-header-cell *matHeaderCellDef> Observaciones </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.observaciones}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="editar">
        <mat-header-cell *matHeaderCellDef> Editar </mat-header-cell>
        <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-primary">Primary</button> </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayColumn"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumn;"></mat-row>
</mat-table>
