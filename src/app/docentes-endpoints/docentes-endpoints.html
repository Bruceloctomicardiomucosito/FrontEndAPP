<mat-table #tableDocentes [dataSource]="dataSource" class="table table-striped">

    <!-- Position Column -->
    <ng-container matColumnDef="idDocente">
        <mat-header-cell *matHeaderCellDef> # </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idDocente}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="codigoDocente">
        <mat-header-cell *matHeaderCellDef> Matricula </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.codigoDocente}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="nombre">
        <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.nombre}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="apellidoPaterno">
        <mat-header-cell *matHeaderCellDef> Apellido Paterno </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.apellidoPaterno}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="apellidoMaterno">
        <mat-header-cell *matHeaderCellDef> Apellido Materno </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.apellidoMaterno}} </mat-cell>
    </ng-container>

        <!-- Position Column -->
    <ng-container matColumnDef="fechaNacimiento">
        <mat-header-cell *matHeaderCellDef> Fecha Nacimiento </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.fechaNacimiento}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="sexo">
        <mat-header-cell *matHeaderCellDef> Sexo </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.sexo}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="editar">
        <mat-header-cell *matHeaderCellDef> Editar </mat-header-cell>
        <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-primary">Editar</button> </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayColumn"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumn;"></mat-row>
</mat-table>
