<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos EndPoints</title>
</head>

<body>
    <!-- CONTENT -->
    <div class="text-center">
        <div class="example-container mat-elevation-z8">
            <mat-table #tableAlumnis [dataSource]="dataSource" class="table table-striped">

                <!-- Position Column -->
                <ng-container matColumnDef="idAlumno">
                    <mat-header-cell *matHeaderCellDef> # </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.idAlumno}} </mat-cell>
                </ng-container>

                <!-- Position Column -->
                <ng-container matColumnDef="matricula">
                    <mat-header-cell *matHeaderCellDef> Matricula </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.matricula}} </mat-cell>
                </ng-container>

                <!-- Position Column -->
                <ng-container matColumnDef="nombre">
                    <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.nombre}} </mat-cell>
                </ng-container>

                <!-- Position Column -->
                <ng-container matColumnDef="apellidoPaterno">
                    <mat-header-cell *matHeaderCellDef> Apellido Paterno </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.apellidoPaterno}} </mat-cell>
                </ng-container>

                <!-- Position Column -->
                <ng-container matColumnDef="apelidoMaterno">
                    <mat-header-cell *matHeaderCellDef> Apellido Materno </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.apelidoMaterno}} </mat-cell>
                </ng-container>

                <!-- Position Column -->
                <ng-container matColumnDef="idSemestreActual">
                    <mat-header-cell *matHeaderCellDef> Semestre Actual </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.idSemestreActual}} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="editar">
                    <mat-header-cell *matHeaderCellDef> Editar </mat-header-cell>
                    <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-primary">Primary</button> </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayColumn"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayColumn;"></mat-row>
            </mat-table>
        </div>
