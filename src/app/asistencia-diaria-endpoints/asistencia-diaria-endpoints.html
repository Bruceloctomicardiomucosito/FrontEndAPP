<mat-table #tableAsistencias [dataSource]="dataSource" class="table table-striped">

    <!-- Position Column -->
    <ng-container matColumnDef="idAsistencia">
        <mat-header-cell *matHeaderCellDef> # </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idAsistencia}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="idDia">
        <mat-header-cell *matHeaderCellDef> Día </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idDia}} </mat-cell>
    </ng-container>
        <!-- Position Column -->
    <ng-container matColumnDef="idModulo">
        <mat-header-cell *matHeaderCellDef> Modulo </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idModulo}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="idAula">
        <mat-header-cell *matHeaderCellDef> Aula </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idAula}} </mat-cell>
    </ng-container>
            <!-- Position Column -->
    <ng-container matColumnDef="idDocente">
        <mat-header-cell *matHeaderCellDef> Docente </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idDocente}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="asistencia">
        <mat-header-cell *matHeaderCellDef> Asistencia </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.asistencia}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="detalles">
        <mat-header-cell *matHeaderCellDef> Detalles </mat-header-cell>
        <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-warning"><i
                    class="fa-solid fa-circle-info"></i></button> </mat-cell>
    </ng-container>

    <ng-container matColumnDef="editar">
        <mat-header-cell *matHeaderCellDef> Editar </mat-header-cell>
        <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-primary"><i
                    class="fa-solid fa-file-pen"></i></button> </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayColumn"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumn;"></mat-row>
</mat-table>
