<mat-table #tableEdificios [dataSource]="dataSource" class="table table-striped">

    <!-- Position Column -->
    <ng-container matColumnDef="idEdificio">
        <mat-header-cell *matHeaderCellDef> # </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idEdificio}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="nombre">
        <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.nombre}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="numeroPisos">
        <mat-header-cell *matHeaderCellDef> # Pisos </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.numeroPisos}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="funcion">
        <mat-header-cell *matHeaderCellDef> Función </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.funcion}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="observaciones">
        <mat-header-cell *matHeaderCellDef> Observaciones </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.observaciones}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="detalles">
        <mat-header-cell *matHeaderCellDef> Detalles </mat-header-cell>
        <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-warning"><i
                    class="fa-solid fa-circle-info"></i></button> </mat-cell>
    </ng-container>

    <ng-container matColumnDef="editar">
        <mat-header-cell *matHeaderCellDef> Editar </mat-header-cell>
        <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-primary"><i
                    class="fa-solid fa-file-pen"></i></button> </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayColumn"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumn;"></mat-row>
</mat-table>
