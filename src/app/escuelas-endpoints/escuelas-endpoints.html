<mat-table #tableEscuelas [dataSource]="dataSource" class="table table-striped">

    <!-- Position Column -->
    <ng-container matColumnDef="claveEscuela">
        <mat-header-cell *matHeaderCellDef> Clave </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.claveEscuela}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="nombre">
        <mat-header-cell *matHeaderCellDef> Nombre </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.nombre}} </mat-cell>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="idNivelEducativo">
        <mat-header-cell *matHeaderCellDef> Nivel Educativo </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.idNivelEducativo}} </mat-cell>
    </ng-container>

        <!-- Position Column -->
    <ng-container matColumnDef="municipioLocalidad">
        <mat-header-cell *matHeaderCellDef> Municipio </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.municipioLocalidad}} </mat-cell>
    </ng-container>

        <!-- Position Column -->
    <ng-container matColumnDef="detalles">
        <mat-header-cell *matHeaderCellDef> Detalles </mat-header-cell>
        <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-primary">Detalles</button> </mat-cell>
    </ng-container>

            <!-- Position Column -->
    <ng-container matColumnDef="editar">
        <mat-header-cell *matHeaderCellDef> Editar </mat-header-cell>
        <mat-cell *matCellDef="let element"> <button type="button" class="btn btn-primary">Editar</button> </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayColumn"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumn;"></mat-row>
</mat-table>
