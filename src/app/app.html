<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #1e1e2f;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #ddd;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #27293d;
            color: white;
        }

        /* --- HEADER --- */
        .header {
            margin-left: 220px;
            padding: 15px;
            background: white;
            border-bottom: 1px solid #ccc;
        }

        /* --- CONTENT --- */
        .content {
            margin-left: 220px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Admin</h2>
        <a href="#">Dashboard</a>
        <a href="#"(click)="contador()">Alumnos</a>
        <a href="#">Licenciaturas</a>
        <a href="#">Escuelas</a>
        <a href="#">Usuarios</a>
        <a href="#">Reportes</a>
        <a href="#">Configuración</a>
    </div>

    <!-- HEADER -->
    <div class="header">
        <h1>Panel de Administración</h1>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <div class="card">
            <h2>Bienvenido</h2>
            <p>Esta es una plantilla básica para un sistema administrador.</p>
        </div>

        <div class="card">
            <h3>Estadísticas, {{title + " " + valor}}</h3>
            <p>Aquí puedes mostrar gráficos, métricas o reportes.</p>
        </div>
    </div>

<script>
    console.log("Panel de administración cargado correctamente.");
</script>

</body>
</html>
